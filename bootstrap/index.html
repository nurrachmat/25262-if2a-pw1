<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moto GP</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"> 
</head>
<body>
    <div class="container">
        <!-- container / container-fluid -->
        <div class="row">
            <div class="col bg-dark rounded p-3">
                <img src="images/mgp-logo-on-dark.svg" alt="" width="200px">
            </div>
        </div>
        <!-- carousel -->
        <div id="carouselExampleAutoplaying" class="carousel slide mt-3" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
            <img src="images/slide1.webp" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
            <img src="images/slide2.webp" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
            <img src="images/slide3.webp" class="d-block w-100" alt="...">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
        </div>

        <!-- latets news -->
        <div class="row mt-3">
            <h2>Latest News</h2>
            <div class="col-lg-3 col-md-6">
                <img src="images/news1.webp" alt="" class="w-100 rounded">
                <a href="#" class="link-primary link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover">News 1</a>
            </div>
            <div class="col-lg-3 col-md-6">
                <img src="images/news2.webp" alt="" class="w-100 rounded">
                <a href="#" class="link-primary link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover">News 1</a>
            </div>
            <div class="col-lg-3 col-md-6">
                <img src="images/news3.webp" alt="" class="w-100 rounded">
                <a href="#" class="link-primary link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover">News 1</a>
            </div>
            <div class="col-lg-3 col-md-6">
                <img src="images/news4.webp" alt="" class="w-100 rounded">
                <a href="#" class="link-primary link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover">News 1</a>
            </div>
        </div>
        <!-- documentaries -->
        <div class="row mt-3">
            <h2>Documentaries</h2>
            <div class="col-lg col-md-3">
                <img src="images/FQ_Documentary_COVER.webp" alt="" class="w-100 rounded">
            </div>
            <div class="col-lg col-md-3">
                <img src="images/Hall_of_fame_Cover_web.webp" alt="" class="w-100 rounded">
            </div>
            <div class="col-lg col-md-3">
                <img src="images/JM_Documentary_COVER.webp" alt="" class="w-100 rounded">
            </div>
            <div class="col-lg col-md-3">
                <img src="images/MGP-MTAC-608x912.webp" alt="" class="w-100 rounded">
            </div>
            <div class="col-lg col-md-3">
                <img src="images/MGP-Sepang_Clash-608x912.webp" alt="" class="w-100 rounded">
            </div>
            <div class="col-lg col-md-3">
                <img src="images/MM_Documentary_COVER.webp" alt="" class="w-100 rounded">
            </div>
            <div class="col-lg col-md-3">
                <img src="images/ROOKIES_Documentary_COVER.webp" alt="" class="w-100 rounded">
            </div>
            <div class="col-lg col-md-3">
                <img src="images/TCBOO_Generic.webp" alt="" class="w-100 rounded">
            </div>
        </div>
        <!-- calendar -->
        <div class="row mt-3">
            <div class="col bg-dark text-white text-center p-5 rounded">
                <h2>SYNC THE MOTOGP CALENDAR</h2>
                <p>Lock in the entire 2026 MotoGP season to your calendar today. Sync it. Mark it. Never miss a race. </p>
                <a href="#" class="btn btn-light">Sync Your Calender</a>
            </div>
        </div>
        <!-- footer -->
    </div>
    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
